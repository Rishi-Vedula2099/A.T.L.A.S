---
- name: Upgrade ATLAS Stack (Rolling Release)
  hosts: atlas_servers
  become: true
  tasks:
    - name: Pull updated images
      command: docker compose -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.prod.yml pull
      args:
        chdir: "{{ atlas_dest_dir }}"

    - name: Apply updated compose stack
      command: docker compose -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.prod.yml up -d
      args:
        chdir: "{{ atlas_dest_dir }}"

    - name: Verify health post-upgrade
      uri:
        url: "http://localhost/readyz"
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 20
      delay: 5
      failed_when: health_check.status != 200
