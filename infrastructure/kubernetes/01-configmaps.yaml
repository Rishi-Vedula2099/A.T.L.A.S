apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-config
  namespace: atlas
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/part-of: atlas
data:
  ATLAS_ENV: "production"
  ATLAS_LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://atlas.example.com"
  # DB connection hosts (services live in this namespace).
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "atlas_admin"
  POSTGRES_DB: "atlas_db"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "atlas-backups"
  MINIO_SECURE: "true"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TTL_MINUTES: "15"
  JWT_REFRESH_TTL_DAYS: "7"
  WHISPER_MODEL_PATH: "base"
  OLLAMA_BASE_URL: "http://ollama:11434"
  ATLAS_BACKUP_SCHEDULE: "0 2 * * *"
  ATLAS_BACKUP_RETENTION: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: atlas
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/part-of: atlas
data:
  # The actual SQL lives in infrastructure/init/postgres/001_init.sql; this
  # ConfigMap is a placeholder for k8s-only overrides. Mount the upstream
  # file via a projected volume in the StatefulSet when you need the schema.
  001_init.sql: |
    -- Placeholder. Mount infrastructure/init/postgres/001_init.sql as a
    -- projected volume in the postgres StatefulSet for the real schema.
    SELECT 1;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-init
  namespace: atlas
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/part-of: atlas
data:
  # Mount infrastructure/init/neo4j/constraints.cypher here in production.
  constraints.cypher: |
    // Placeholder. See infrastructure/init/neo4j/constraints.cypher.
