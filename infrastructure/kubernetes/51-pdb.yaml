apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-backend-pdb
  namespace: atlas
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-frontend-pdb
  namespace: atlas
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-frontend
