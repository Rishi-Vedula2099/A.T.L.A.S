apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: atlas
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: atlas
    app.kubernetes.io/component: database
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
      app.kubernetes.io/part-of: atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/part-of: atlas
        app.kubernetes.io/component: database
    spec:
      # Neo4j official image runs as root by default; fsGroup keeps the volume
      # writable. Run as non-root in production by building a custom image.
      securityContext:
        fsGroup: 7474
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - { name: bolt,  containerPort: 7687 }
            - { name: http,  containerPort: 7474 }
          env:
            - name: NEO4J_AUTH
              value: "neo4j/$(NEO4J_PASSWORD)"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: { name: atlas-db-secret, key: neo4j-password }
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /logs }
          readinessProbe:
            httpGet: { path: /, port: 7474 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 7687 }
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits:   { cpu: "2",    memory: "4Gi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: neo4j-data }
        - name: logs
          emptyDir: {}
