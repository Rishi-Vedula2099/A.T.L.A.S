apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - { name: pg,   port: 5432, targetPort: pg }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - { name: bolt, port: 7687, targetPort: bolt }
    - { name: http, port: 7474, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - { name: http, port: 6333, targetPort: http }
    - { name: grpc, port: 6334, targetPort: grpc }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - { name: s3,      port: 9000, targetPort: s3 }
    - { name: console, port: 9001, targetPort: console }
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-backend
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlas-backend
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-frontend
  namespace: atlas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlas-frontend
  ports:
    - { name: http, port: 80, targetPort: http }
