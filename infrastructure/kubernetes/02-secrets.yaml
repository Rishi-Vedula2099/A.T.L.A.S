# ==============================================================================
# Secrets
# ==============================================================================
# NOTE: This file contains PLACEHOLDERS only. Do NOT commit real secret values.
# Provision real secrets using ONE of:
#
#   1.kubectl + sealed-secrets:
#       echo -n 'p@ssw0rd' | kubectl create secret generic atlas-db-secret \
#         --namespace=atlas \
#         --from-file=postgres-password=- \
#         --dry-run=client -o yaml | kubectl apply -f -
#
#   2. External Secrets Operator (recommended for enterprise):
#       point at AWS Secrets Manager / Azure Key Vault / GCP Secret Manager
#       via an ExternalSecret CRD (not shown here).
#
#   3. Sealed Secrets (Bitnami):
#       kubeseal < atlas-secret.yaml > atlas-sealedsecret.yaml
#
# Once provisioned, delete this file from your tree so plaintext never lands
# in git. (It is intentionally commented out so `kubectl apply` is a no-op.)
# ==============================================================================
# apiVersion: v1
# kind: Secret
# metadata:
#   name: atlas-db-secret
#   namespace: atlas
#   labels:
#     app.kubernetes.io/name: atlas
#     app.kubernetes.io/part-of: atlas
# type: Opaque
# stringData:
#   postgres-password: "REPLACE_ME"
#   neo4j-password: "REPLACE_ME"
#   redis-password: "REPLACE_ME"
#   jwt-secret: "REPLACE_ME"
#   jwt-refresh-secret: "REPLACE_ME"
#   atlas-api-key: "REPLACE_ME"
#   minio-access-key: "REPLACE_ME"
#   minio-secret-key: "REPLACE_ME"
#   atlas-backup-key: "REPLACE_ME"
#   bootstrap-admin-password: "REPLACE_ME"
---
# Reference Secret describing the SHAPE the workloads expect. Apply after
# filling real values via one of the methods above.
apiVersion: v1
kind: Secret
metadata:
  name: atlas-db-secret
  namespace: atlas
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/part-of: atlas
type: Opaque
stringData: {}
