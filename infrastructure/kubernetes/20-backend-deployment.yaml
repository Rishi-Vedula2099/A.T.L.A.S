apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-backend
  namespace: atlas
  labels:
    app.kubernetes.io/name: atlas-backend
    app.kubernetes.io/part-of: atlas
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-backend
      app.kubernetes.io/part-of: atlas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-backend
        app.kubernetes.io/part-of: atlas
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: atlas-backend
          image: ghcr.io/atlas/atlas-backend:latest   # override with ATLAS_IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: atlas-config }
            - secretRef:    { name: atlas-db-secret }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            # Atlas writes screenshots / temp under /tmp; back it with emptyDir
            # because the root filesystem is read-only.
            - { name: tmp,  mountPath: /tmp }
            - { name: data, mountPath: /app/data }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
