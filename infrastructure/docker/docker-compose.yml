# ==============================================================================
# A.T.L.A.S — base Docker Compose
# ==============================================================================
# Brings up the LEAN CORE stack:
#   databases (postgres, redis, neo4j, qdrant) + atlas-backend + atlas-frontend
#   + traefik (reverse proxy) + minio (object storage for backups)
#
# Opt in to more with profiles:
#   docker compose --profile observability up -d   # prometheus/grafana/loki/...
#   docker compose --profile messaging up -d       # kafka + zookeeper
#   docker compose --profile gpu up -d             # GPU reservations on backend
#   docker compose --profile backup up -d          # scheduled backup job
#
# Variants:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml  up   # dev
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up   # prod
#
# All secrets come from .env (generated by ./install or scripts/generate_env.py).
# ==============================================================================

# docker compose v2 ignores the legacy `version:` key; omitted for clarity.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

x-backend-env: &backend-env
  ATLAS_ENV: ${ATLAS_ENV:-development}
  ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,tauri://localhost}
  # Auth
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
  ATLAS_BOOTSTRAP_ADMIN_EMAIL: ${ATLAS_BOOTSTRAP_ADMIN_EMAIL:-}
  ATLAS_BOOTSTRAP_ADMIN_PASSWORD: ${ATLAS_BOOTSTRAP_ADMIN_PASSWORD:-}
  # Postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-atlas_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-atlas_db}
  # Redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  # Neo4j
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  # Qdrant
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  # MinIO
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-atlas-backups}
  MINIO_SECURE: "false"
  ATLAS_BACKUP_KEY: ${ATLAS_BACKUP_KEY}
  # LLM (optional)
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  PORCUPINE_ACCESS_KEY: ${PORCUPINE_ACCESS_KEY:-}
  WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-base}

services:
  # ===========================================================================
  # Databases
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas_admin} -d ${POSTGRES_DB:-atlas_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [atlas-database]
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [atlas-database]
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 512m

  neo4j:
    image: neo4j:5-community
    container_name: atlas-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ../init/neo4j:/init:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [atlas-database]
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 1g

  qdrant:
    image: qdrant/qdrant:latest
    container_name: atlas-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [atlas-database]
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 512m

  # ===========================================================================
  # Application
  # ===========================================================================
  atlas-backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    image: atlas-backend:local
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [atlas-backend, atlas-database]
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 2g
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=atlas-backend"
      - "traefik.http.routers.atlas-backend.rule=Host(`api.atlas.localhost`)"
      - "traefik.http.routers.atlas-backend.entrypoints=web"
      - "traefik.http.services.atlas-backend.loadbalancer.server.port=8000"
      # Rate limiting on API
      - "traefik.http.routers.atlas-backend.middlewares=atlas-ratelimit"

  atlas-frontend:
    build:
      context: ../../apps/desktop-client
      dockerfile: Dockerfile
    image: atlas-frontend:local
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api.atlas.localhost
      NEXT_PUBLIC_WS_URL: ws://api.atlas.localhost/ws
    depends_on:
      atlas-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [atlas-frontend]
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=atlas-frontend"
      - "traefik.http.routers.atlas-frontend.rule=Host(`atlas.localhost`,`localhost`)"
      - "traefik.http.routers.atlas-frontend.entrypoints=web"
      - "traefik.http.services.atlas-frontend.loadbalancer.server.port=3000"

  # ===========================================================================
  # Reverse proxy
  # ===========================================================================
  traefik:
    image: traefik:v3.1
    container_name: atlas-traefik
    command:
      - "--global.sendAnonymousUsage=false"
      - "--api=false"
      - "--log.level=${ATLAS_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # TLS entrypoint (cert resolved via dynamic config / ACME in prod)
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [atlas-frontend, atlas-backend, atlas-management]
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 256m

  # ===========================================================================
  # Object storage (backup target)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: atlas-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [atlas-management]
    logging: *default-logging
    <<: *default-restart
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=atlas-management"
      - "traefik.http.routers.atlas-minio.rule=Host(`minio.atlas.localhost`)"
      - "traefik.http.routers.atlas-minio.entrypoints=web"
      - "traefik.http.services.atlas-minio.loadbalancer.server.port=9001"

  # ===========================================================================
  # Backup (opt-in profile)
  # ===========================================================================
  atlas-backup:
    profiles: ["backup"]
    build:
      context: ../..
      dockerfile: infrastructure/backup/Dockerfile
    image: atlas-backup:local
    container_name: atlas-backup
    environment:
      <<: *backend-env
      ATLAS_BACKUP_SCHEDULE: ${ATLAS_BACKUP_SCHEDULE:-0 2 * * *}
      ATLAS_BACKUP_RETENTION: ${ATLAS_BACKUP_RETENTION:-14}
    depends_on:
      postgres: { condition: service_healthy }
      neo4j:    { condition: service_healthy }
      redis:    { condition: service_healthy }
      qdrant:   { condition: service_healthy }
      minio:    { condition: service_healthy }
    volumes:
      - backup_work:/work
    networks: [atlas-management, atlas-database]
    logging: *default-logging
    <<: *default-restart

  # ===========================================================================
  # Observability (opt-in profile)
  # ===========================================================================
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    container_name: atlas-prometheus
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks: [atlas-monitoring, atlas-backend]
    logging: *default-logging
    <<: *default-restart
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=atlas-monitoring"
      - "traefik.http.routers.atlas-prometheus.rule=Host(`prometheus.atlas.localhost`)"
      - "traefik.http.routers.atlas-prometheus.entrypoints=web"
      - "traefik.http.services.atlas-prometheus.loadbalancer.server.port=9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    container_name: atlas-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [atlas-monitoring]
    logging: *default-logging
    <<: *default-restart
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=atlas-monitoring"
      - "traefik.http.routers.atlas-grafana.rule=Host(`grafana.atlas.localhost`)"
      - "traefik.http.routers.atlas-grafana.entrypoints=web"
      - "traefik.http.services.atlas-grafana.loadbalancer.server.port=3000"

  loki:
    profiles: ["observability"]
    image: grafana/loki:latest
    container_name: atlas-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    networks: [atlas-monitoring]
    logging: *default-logging
    <<: *default-restart

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:latest
    container_name: atlas-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../observability/promtail.yml:/etc/promtail/config.yml:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    networks: [atlas-monitoring]
    logging: *default-logging
    <<: *default-restart

  cadvisor:
    profiles: ["observability"]
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: atlas-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [atlas-monitoring]
    logging: *default-logging
    <<: *default-restart

  node-exporter:
    profiles: ["observability"]
    image: prom/node-exporter:latest
    container_name: atlas-node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks: [atlas-monitoring]
    logging: *default-logging
    <<: *default-restart

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:latest
    container_name: atlas-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yml:/etc/otelcol/config.yaml:ro
    networks: [atlas-monitoring, atlas-backend]
    logging: *default-logging
    <<: *default-restart

  # ===========================================================================
  # Messaging (opt-in profile)
  # ===========================================================================
  zookeeper:
    profiles: ["messaging"]
    image: confluentinc/cp-zookeeper:latest
    container_name: atlas-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [atlas-backend]
    logging: *default-logging
    <<: *default-restart

  kafka:
    profiles: ["messaging"]
    image: confluentinc/cp-kafka:latest
    container_name: atlas-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on: [zookeeper]
    networks: [atlas-backend]
    logging: *default-logging
    <<: *default-restart

# ==============================================================================
# Networks (segmented)
# ==============================================================================
networks:
  atlas-frontend:
    name: atlas-frontend
  atlas-backend:
    name: atlas-backend
  atlas-database:
    name: atlas-database
  atlas-monitoring:
    name: atlas-monitoring
  atlas-management:
    name: atlas-management

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  backup_work:
