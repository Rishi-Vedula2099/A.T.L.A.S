{{- if .Values.neo4j.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: database
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "atlas.labels" . | nindent 8 }}
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 7474
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image | quote }}
          ports:
            - { name: bolt, containerPort: 7687 }
            - { name: http, containerPort: 7474 }
          env:
            - name: NEO4J_AUTH
              value: "neo4j/$(NEO4J_PASSWORD)"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: { name: atlas-db-secret, key: neo4j-password }
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /logs }
          readinessProbe:
            httpGet: { path: /, port: 7474 }
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: 7687 }
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            {{- toYaml .Values.neo4j.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: neo4j-data }
        - name: logs
          emptyDir: {}
{{- end }}
---
{{- if .Values.neo4j.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: {{ .Values.namespace }}
  labels: {{- include "atlas.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.neo4j.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.neo4j.persistence.size | quote }}
{{- end }}
