{{- if or .Values.secrets.postgresPassword .Values.secrets.neo4jPassword .Values.secrets.jwtSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: atlas-db-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets }}
  postgres-password: {{ .postgresPassword | quote }}
  neo4j-password: {{ .neo4jPassword | quote }}
  redis-password: {{ .redisPassword | quote }}
  jwt-secret: {{ .jwtSecret | quote }}
  jwt-refresh-secret: {{ .jwtRefreshSecret | quote }}
  atlas-api-key: {{ .atlasApiKey | quote }}
  minio-access-key: {{ .minioAccessKey | quote }}
  minio-secret-key: {{ .minioSecretKey | quote }}
  atlas-backup-key: {{ .atlasBackupKey | quote }}
  bootstrap-admin-password: {{ .bootstrapAdminPassword | quote }}
  {{- end }}
{{- else -}}
{{/* Emit an empty secret so workloads that reference it don't fail. */}}
apiVersion: v1
kind: Secret
metadata:
  name: atlas-db-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
  annotations:
    atlas.io/notice: "Empty placeholder. Provision via External Secrets Operator / Sealed Secrets / `kubectl create secret`."
type: Opaque
{{- end }}
